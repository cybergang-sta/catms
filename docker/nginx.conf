# CATMS — bundled nginx configuration.
#
# Replaces the image default entirely. The document root is public/ and nothing
# above it is reachable: the single most important line in this file is the
# `location ~ \.php$` block that only ever executes a script inside public/.

user www-data;
worker_processes auto;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Correlating an nginx access line with an application log line. The
    # application reads the same header and puts it in every log entry, so a
    # user reporting a failure at a given minute maps to exactly one request.
    log_format catms '$remote_addr - $request_id [$time_local] "$request" '
                     '$status $body_bytes_sent ${request_time} '
                     '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout catms;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Uploads are capped to match post_max_size in php-fpm.conf. nginx rejects an
    # oversized body before PHP reads it into memory.
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Gzip for JSON and text. Compression ratios on a timetable response are
    # good and the mobile clients in the pilot are bandwidth-constrained.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types        application/json
                      application/javascript
                      text/css
                      text/plain
                      text/xml
                      image/svg+xml;

    # Rate limiting at the edge, in front of PHP. This is a coarse first pass;
    # the per-bucket limits in App\Core\RateLimiter are the authoritative ones
    # and are keyed on the authenticated subject.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_status 429;

    # The request id is generated here so that even a request rejected by nginx
    # below has one, and the client can quote it. A client-supplied id is
    # accepted when it looks like an id, which is what lets a mobile client
    # correlate a retry with the attempt that failed. `map` is only valid in the
    # http context, so it lives here and not inside the server block.
    map $http_x_request_id $catms_request_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    server {
        listen       80 default_server;
        server_name  _;

        root  /var/www/html/public;
        index index.php;

        charset utf-8;

        add_header X-Request-Id $catms_request_id always;

        # ── Security headers ───────────────────────────────────────────────
        # The application sets these too (App\Core\Response::send); repeating
        # them here means a static asset response has them as well, and a
        # rejected request never reaches PHP to receive them.
        add_header X-Content-Type-Options    "nosniff"        always;
        add_header X-Frame-Options           "DENY"           always;
        add_header Referrer-Policy           "no-referrer"    always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # The PWA needs a service worker at the root scope, and needs to be
        # allowed to use the camera for the room QR scan (BR-09).
        add_header Permissions-Policy        "camera=(self), geolocation=()" always;

        # ── Compression is negotiated here; do not let PHP re-encode ────────
        fastcgi_keep_conn on;

        # ── Front controller ────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Only public/*.php is executable. Every other .php path in the image —
        # src/, config/, tests/, bin/ — is outside the document root, so it is
        # already unreachable; this block makes that explicit for anything that
        # might one day be copied in.
        location ~ \.php$ {
            # `try_files` before `fastcgi_pass` is what turns
            # /src/Core/Config.php into a 404 instead of executing it.
            try_files $uri =404;

            include        fastcgi_params;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;

            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  HTTP_X_REQUEST_ID $catms_request_id;

            # Only the front controller is allowed to be requested by name.
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_param  PATH_INFO $fastcgi_path_info;

            # Sized above the engine's 2.5 s budget and below php-fpm's 30 s
            # terminate timeout, so a slow request is cut off at the web tier
            # with a 504 the client can act on.
            fastcgi_read_timeout 30s;
            fastcgi_send_timeout 30s;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 8 16k;
        }

        # Static assets. The service worker and the manifest must never be
        # cached for long or a deploy does not reach installed clients.
        location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webmanifest)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            try_files $uri =404;
        }

        location = /service-worker.js {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        # ── API throttling ─────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            try_files $uri /index.php$is_args$args;
        }

        # Health checks come from the load balancer on a short interval; they
        # must not be rate limited into a false "unhealthy".
        location = /health {
            access_log off;
            try_files $uri /index.php$is_args$args;
        }

        # Dotfiles are never served. `.env` in particular.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        error_page 404 /index.php;
        error_page 500 502 503 504 /index.php;

        # No directory listings, ever.
        autoindex off;
    }
}
