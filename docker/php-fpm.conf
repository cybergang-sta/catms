# CATMS — bundled PHP-FPM pool overrides.
#
# Dropped in as zz-catms.conf so it is read after the image's own www.conf and
# therefore wins.

[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000

; Only nginx is ever on the other end, in the same container or the compose
; network. A TCP socket is still used because that is what docker's own
; guidance and most orchestrators expect; the port is not published.
listen.allowed_clients = 127.0.0.1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16

; Worker count. The allocation engine is CPU-bound and single-request-per-worker,
; so oversubscribing CPUs here makes the 3 s response target harder to hit, not
; easier. Sized from the compose memory/CPU limits rather than the host's core
; count, which inside a container is the whole machine.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
; Recycle a worker after this many requests. PHP leaks slowly under sustained
; load; a bounded worker lifetime is cheaper than chasing the leak.
pm.max_requests = 500

; A request that runs the allocation engine has a 2.5 s internal budget, so a
; runaway request is stopped long before PHP's own default of 30 s would.
request_terminate_timeout = 30s

; The maintenance flag is a file in the volume, and the logs are written by the
; application, so a request that cannot write is a configuration error worth
; seeing in the error log.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; The application never relies on PHP uploading files in v1, but a cap keeps a
; stray multipart body from filling the volume.
upload_max_filesize = 8M
post_max_size = 10M
